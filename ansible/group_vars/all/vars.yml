# Valores NO sensibles — van al repo tal cual. Los secretos viven en
# group_vars/vault.yml (encriptado con ansible-vault, ver README.md).

# --- Runner de GitHub Actions ---
# Uno por repo (no uno solo a nivel organización) — ver el comentario en
# roles/github_runner/tasks/main.yml para el porqué.
github_runner_repos:
  - sitio-web-digital/frontend-sitio-web-digital
  - sitio-web-digital/backend-sitio-web-digital
  - sitio-web-digital/backend-puntoCO2
  - sitio-web-digital/campus
  - sitio-web-digital/gestock-app
github_runner_version: "2.321.0" # revisar la última en https://github.com/actions/runner/releases
github_runner_labels: "self-hosted,linux,x64,aws"
github_runner_user: github-runner
github_runner_home: /opt/actions-runner

# --- Rutas en el servidor ---
app_root: /opt/sitioweb
db_compose_dir: "{{ app_root }}/db"
backend_env_path: "{{ app_root }}/backend.env" # mismo path que espera server/.github/workflows/deploy-backend.yml
cloudflared_config_dir: /etc/cloudflared

# --- Puertos (coinciden con los workflows de deploy de cada repo) ---
backend_port: 4000
frontend_host_port: 8081
db_host_port: 5435

# --- Postgres (nombre de usuario/DB — la contraseña va en el vault) ---
db_user: sitioweb
db_name: sitioweb_digital

# --- AWS (el backend usa el rol de la instancia, no access keys — ver
#     terraform/iam.tf) ---
aws_region: sa-east-1
s3_bucket_name: sitiowebdigital-media
cloudfront_domain: d38e2ri338t20n.cloudfront.net

# --- Dominio propio (migrado de cloudfordeploy.com el 2026-08-08) ---
# Mismos hostnames que terraform/variables.tf (app_hostname/api_hostname/
# customer_wildcard_hostname) y VITE_ROOT_DOMAIN del frontend.
#
# app_url usa a propósito el hostname VIEJO, no app.sitioweb.digital: el
# validador de back_url de Mercado Pago rechaza el TLD .digital entero
# (probado en vivo, 2026-08-08 — no es cosa nuestra). Mismo túnel/servicio
# de siempre, solo distinto hostname para esta única cosa — ver
# terraform/cloudflare.tf > mp_back_url_hostname y subscription.js.
app_url: "https://sitiowebdigital.cloudfordeploy.com"
root_domain: "sitioweb.digital" # arma los links de sitio (subdominio.dominio) en los mails

# --- Mails transaccionales (ver server/src/utils/mail.js) ---
mail_from: "SitioWeb Digital <no-reply@sitioweb.digital>"
# El acceso de producción de SES ya se aprobó (2026-08-10) — MAIL_OVERRIDE_TO
# (que redirigía TODO mail real a una sola casilla, sin importar el
# destinatario) se sacó del backend.env.j2 a propósito. Los mails de
# cuentas de prueba de Mercado Pago (@testuser.com) se siguen redirigiendo
# solos — ver TEST_BUYER_REDIRECT_TO en mail.js, eso no depende de esta var.

# --- cloudflared ---
cloudflared_version: "2024.10.0" # revisar la última en https://github.com/cloudflare/cloudflared/releases

# Los dos túneles — el token de cada uno sale del vault (ver
# group_vars/vault.yml.example y scripts/fetch-tunnel-tokens.sh). "frontend"
# apunta a nginx (:{{ frontend_host_port }}), "api" al backend Node
# (:{{ backend_port }}) — ver terraform/cloudflare.tf para el ingress de
# cada uno.
cloudflared_tunnels:
  - name: frontend
    token: "{{ vault_cloudflare_tunnel_token_frontend }}"
  - name: api
    token: "{{ vault_cloudflare_tunnel_token_api }}"
  - name: matafuego-api
    token: "{{ vault_cloudflare_tunnel_token_matafuego_api }}"
  - name: campus
    token: "{{ vault_cloudflare_tunnel_token_campus }}"
  - name: stock
    token: "{{ vault_cloudflare_tunnel_token_stock }}"

# --- Matafuego SaaS (puntoco2.com) — segunda app en la misma instancia -----
# Mismo patrón que el backend de sitio web (roles/backend_env), pero en su
# propio archivo/puerto/Postgres para no tocar nada de lo que ya funciona.
# El puerto tiene que coincidir con matafuego_backend_port de terraform/ (el
# ingress del túnel apunta ahí) y con PORT en el .env generado. Un solo
# Next.js sirve TODO puntoco2.com (app y landing por path, ver cloudflare.tf)
# — no hay un puerto/túnel/deploy aparte para "la landing".
matafuego_app_name: puntoco2-backend # nombre de imagen/contenedor que usa deploy-backend.yml del repo
matafuego_backend_port: 4001
matafuego_env_path: "{{ app_root }}/puntoco2-backend.env" # mismo path que espera backend-puntoCO2/.github/workflows/deploy-backend.yml
matafuego_db_compose_dir: "{{ app_root }}/matafuego-db"
matafuego_db_host_port: 5436
matafuego_db_user: matafuego
matafuego_db_name: matafuego_saas

# --- Campus C4D (campus.cloudfordeploy.com) — tercera app en la misma
# instancia. A diferencia de sitio web/Matafuego, es un monolito Node +
# SQLite (better-sqlite3) — sin Postgres ni contenedor de base de datos
# propio: todo el estado (SQLite + facturas subidas) vive en un directorio
# del host montado como volumen (ver roles/campus_env y el workflow
# deploy-backend.yml del propio repo).
campus_app_name: campus
campus_backend_port: 3000
campus_env_path: "{{ app_root }}/campus.env" # mismo path que espera campus/.github/workflows/deploy-backend.yml
campus_data_dir: "{{ app_root }}/campus-data" # ídem DATA_DIR de ese workflow

# --- Gestock (stock.cloudfordeploy.com) — cuarta app en la misma instancia -
# Control de stock genérico (Node + Fastify + Postgres). Un solo contenedor
# sirve la API (/api/*) y el frontend estático (web/app.html) al mismo
# tiempo (ver server/src/index.ts del repo), por eso un solo puerto/túnel,
# igual que Campus — pero con Postgres propio (como Matafuego), no SQLite.
gestock_app_name: gestock-app # nombre de imagen/contenedor que usa deploy-backend.yml del repo
gestock_backend_port: 4002
gestock_env_path: "{{ app_root }}/gestock.env" # mismo path que espera gestock-app/.github/workflows/deploy-backend.yml
gestock_db_compose_dir: "{{ app_root }}/gestock-db"
gestock_db_host_port: 5437
gestock_db_user: gestock
gestock_db_name: gestock
