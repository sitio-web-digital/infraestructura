# Copia 1:1 del docker-compose.yml del frontend (mismo servicio "db"), pero
# vive acá porque en el servidor real no depende del checkout de ningún
# repo — el runner los clona y borra en cada corrida, y este container tiene
# que sobrevivir entre deploys. Si el schema del frontend cambia
# (docker-compose.yml del repo raíz) o el de init.sql (server/db/init.sql
# del backend), traé la copia nueva acá a mano y volvé a correr el
# playbook — ansible/roles/postgres/tasks/main.yml explica por qué
# init.sql solo importa la primera vez.
services:
  db:
    image: postgres:16-alpine
    container_name: sitiowebdigital-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - sitiowebdigital_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sitiowebdigital_pgdata:
