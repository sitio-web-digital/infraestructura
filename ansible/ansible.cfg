[defaults]
inventory      = inventory/hosts.ini
remote_user    = ubuntu
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
roles_path = roles
# El vault de secretos (group_vars/vault.yml) se desencripta pasando
# --vault-password-file .vault_pass (o --ask-vault-pass) a mano en cada
# comando — a propósito no está fijado acá, así ansible-playbook con
# --syntax-check/--list-tasks sigue andando sin pedir la contraseña del
# vault. Ver README.md.

[privilege_escalation]
become = True
become_method = sudo
