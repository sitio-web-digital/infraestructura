---
# Mismo patrón que roles/matafuego_env / roles/gestock_env, para la quinta
# app (Farmacias del Sur). `docker run --env-file` lo lee el CLIENTE de
# docker (el proceso `docker run`, corriendo como github_runner_user vía
# deploy-backend.yml del repo farmacia-monolito) — no pasa un path al
# daemon, así que necesita poder ABRIR el archivo directo, no solo que el
# daemon (root) pueda leerlo. group=github_runner_user + 0640 es el mínimo
# que sigue sin exponerlo a cualquier otro usuario de la máquina.
- name: Generar {{ farmacia_env_path }}
  ansible.builtin.template:
    src: farmacia.env.j2
    dest: "{{ farmacia_env_path }}"
    owner: root
    group: "{{ github_runner_user }}"
    mode: "0640"
  no_log: true
