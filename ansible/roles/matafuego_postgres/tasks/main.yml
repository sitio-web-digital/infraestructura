---
# Segunda base de datos en la misma instancia, para Matafuego SaaS —
# contenedor, volumen y puerto (5436) propios, sin tocar nada del Postgres
# de sitio web (roles/postgres, sitiowebdigital-db en 5435). El schema lo
# crean las migraciones de Prisma en cada arranque del backend (ver
# files/matafuego-db/docker-compose.yml), no un init.sql — por eso este role
# no tiene el paso de "solo importa la primera vez" que sí tiene postgres/.

- name: Crear {{ matafuego_db_compose_dir }}
  ansible.builtin.file:
    path: "{{ matafuego_db_compose_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copiar docker-compose.yml de la base de datos de Matafuego
  ansible.builtin.copy:
    src: matafuego-db/docker-compose.yml
    dest: "{{ matafuego_db_compose_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  register: matafuego_db_compose_file

- name: Generar matafuego-db/.env con las credenciales (no queda en el docker-compose.yml)
  ansible.builtin.template:
    src: db.env.j2
    dest: "{{ matafuego_db_compose_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  register: matafuego_db_env_file
  no_log: true

- name: Levantar (o recrear) el contenedor de Postgres de Matafuego
  community.docker.docker_compose_v2:
    project_src: "{{ matafuego_db_compose_dir }}"
    state: present
    pull: missing
  register: matafuego_db_compose_up

- name: Esperar a que Postgres de Matafuego esté healthy
  ansible.builtin.command:
    cmd: >-
      docker inspect --format='{{ '{{' }}.State.Health.Status{{ '}}' }}'
      matafuego-db
  register: matafuego_db_health
  changed_when: false
  until: matafuego_db_health.stdout == "healthy"
  retries: 12
  delay: 5
