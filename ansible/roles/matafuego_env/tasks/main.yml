---
# Mismo patrón que roles/backend_env, para la segunda app (Matafuego SaaS).
# `docker run --env-file` lo lee el CLIENTE de docker (el proceso `docker
# run`, corriendo como github_runner_user vía deploy-backend.yml del repo
# backend-puntoCO2) — no pasa un path al daemon, así que necesita poder
# ABRIR el archivo directo, no solo que el daemon (root) pueda leerlo.
# group=github_runner_user + 0640 es el mínimo que sigue sin exponerlo a
# cualquier otro usuario de la máquina (mismo motivo que backend_env).
- name: Generar {{ matafuego_env_path }}
  ansible.builtin.template:
    src: matafuego.env.j2
    dest: "{{ matafuego_env_path }}"
    owner: root
    group: "{{ github_runner_user }}"
    mode: "0640"
  no_log: true
