# Mismo patrón que roles/matafuego_postgres / roles/gestock_postgres:
# contenedor, volumen y puerto propios, sin tocar nada de los otros Postgres
# de la instancia (sitiowebdigital-db en 5435, matafuego-db en 5436,
# gestock-db en 5437). El schema lo crean las migraciones de Prisma
# (`prisma migrate deploy`, corridas por el propio workflow de deploy del
# repo), no un init.sql.
services:
  db:
    image: postgres:16-alpine
    container_name: farmacia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - farmacia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  farmacia_pgdata:
