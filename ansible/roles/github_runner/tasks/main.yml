---
# Un runner por REPO (no uno solo a nivel organización): la cuenta que
# tiene el PAT (vault_github_runner_pat) es colaboradora de los dos repos
# pero no figura como miembro de la organización sitio-web-digital, y
# registrar un runner a nivel org pide justamente eso — devuelve 404
# aunque el token tenga el scope admin:org (confirmado a mano contra la
# API: GET /orgs/sitio-web-digital también da 404 con este token).
# Registrar a nivel repo en cambio solo pide admin sobre CADA repo
# puntual, que la cuenta sí tiene. Se puede volver a un solo runner de
# organización más adelante (arreglando la membership) sin tocar nada de
# la app — es un detalle de cómo se registra el runner, no de cómo
# despliega.
#
# Cada repo de github_runner_repos (ver group_vars/all/vars.yml) corre
# como su propio servicio systemd, en su propio directorio
# ({{ github_runner_home }}-<repo>) — un runner caído o mal registrado no
# afecta al del otro repo. La lógica de cada uno vive en register_one.yml
# porque un `block` no admite `loop` directamente en Ansible — solo un
# `include_tasks` sí.

- name: Crear el usuario del runner (si no existe ya, ver roles/docker)
  ansible.builtin.user:
    name: "{{ github_runner_user }}"
    system: true
    shell: /bin/bash
    create_home: true

- name: Preparar cada runner (uno por repo)
  ansible.builtin.include_tasks:
    file: register_one.yml
  vars:
    runner_slug: "{{ item | regex_replace('.*/', '') }}"
    runner_home: "{{ github_runner_home }}-{{ runner_slug }}"
    runner_name: "{{ ansible_hostname }}-{{ runner_slug }}"
    service_name_slug: "{{ item | regex_replace('/', '-') }}"
  loop: "{{ github_runner_repos }}"
  loop_control:
    label: "{{ item }}"
